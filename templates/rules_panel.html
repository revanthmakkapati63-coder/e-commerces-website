{% extends "base.html" %}
{% block title %}Validation Rules{% endblock %}
{% block content %}
<h2>Validation Rules</h2>
<table class="table">
  <thead><tr><th>ID</th><th>Rule Name</th><th>Pattern</th><th>Status</th><th>Action</th></tr></thead>
  <tbody>
  {% for r in rules %}
    <tr>
      <td>{{ r.id }}</td>
      <td>{{ r.rule_name }}</td>
      <td>{{ r.pattern }}</td>
      <td>{{ r.status }}</td>
      <td><a href="#">Toggle</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
